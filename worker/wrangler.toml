# Cloudflare Worker 설정. 조회용 정적 JSON 을 R2 에서 읽어 캐시·CORS 를 붙여 내보낸다.
# 배포: npx wrangler deploy   (Actions 에서는 CLOUDFLARE_API_TOKEN 비밀값 사용)

name = "khu-notice-api"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
# 대시보드에서 넣은 변수·비밀값을 배포가 지우지 않게 한다. 2026-09-08 12:51 배포가
# 사용자가 넣은 KHU_GITHUB_TOKEN 을 지워 버렸다.
keep_vars = true

# 산 도메인(경희공지.info, punycode xn--289a5d743g7dm.info). Cloudflare 가 DNS 와 인증서를 스스로 만든다.
# workers.dev 주소도 그대로 둔다.
routes = [
  { pattern = "api.xn--289a5d743g7dm.info", custom_domain = true },
]

# 조회 버킷만 바인딩한다. 원문 증거·백업 버킷은 Worker 에 연결하지 않는다(15.2절).
[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "khu-notice-public"

[observability]
enabled = true

# 수집 깨우기(13절). GitHub 예약 실행이 빠지는 일이 잦아, 매시 17분에 여기서
# GitHub 에 workflow_dispatch 를 보낸다. 분만 맞으면 되므로 UTC 기준으로도 매시 17분이다.
# 토큰(KHU_GITHUB_TOKEN)은 Cloudflare 비밀값이라 이 파일에 없다. 토큰이 없으면 아무것도 하지 않는다.
[triggers]
crons = ["17 * * * *"]

[vars]
KHU_GITHUB_REPO = "sihort183-creator/khu"
KHU_COLLECT_WORKFLOW = "collect.yml"
