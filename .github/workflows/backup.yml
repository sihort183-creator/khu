name: 백업

# 6시간마다 논리 백업을 만들어 R2 백업 버킷에 올린다(17.2절).
# 무료 요금제에는 공급자 자동 백업이 없으므로 이것이 유일한 복구 수단이다.
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "새 백업을 만들지 않고 최근 백업만 확인"
        type: boolean
        default: false

concurrency:
  group: khu-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: production
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}
      KHU_R2_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
      # 백업 버킷은 쓰기 전용 키를 쓴다. 수집 실행의 키로 백업을 지울 수 없다(17.2절).
      KHU_R2_ACCESS_KEY_ID: ${{ secrets.KHU_R2_BACKUP_ACCESS_KEY_ID }}
      KHU_R2_SECRET_ACCESS_KEY: ${{ secrets.KHU_R2_BACKUP_SECRET_ACCESS_KEY }}
      KHU_R2_BUCKET_BACKUP: ${{ vars.KHU_R2_BUCKET_BACKUP || 'khu-notice-backup' }}
      KHU_BACKUP_PASSPHRASE: ${{ secrets.KHU_BACKUP_PASSPHRASE }}
      KHU_BACKUP_HEARTBEAT_URL: ${{ secrets.KHU_BACKUP_HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: PostgreSQL 클라이언트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 백업 만들기
        if: ${{ !inputs.verify_only }}
        run: python -m app.run.backup --prune

      - name: 백업 확인
        run: python -m app.run.backup --verify

      - name: 보관 목록
        if: always()
        run: |
          echo '### 보관 중인 백업' >> "$GITHUB_STEP_SUMMARY"
          python -m app.run.backup --list | tail -20 >> "$GITHUB_STEP_SUMMARY"
