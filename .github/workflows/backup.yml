name: 백업

# 주 1회 논리 백업을 만들어 R2 백업 버킷에 올린다(17.2절).
# 무료 요금제에는 공급자 자동 백업이 없으므로 이것이 유일한 복구 수단이다.
#
# 2026-09-09 Supabase 가 데이터베이스에서 나간 데이터(egress) 무료 한도 5GB/월 초과를
# 통지했다. 백업은 pg_dump 원본 약 125MB 를 매번 통째로 읽어 가므로 하루 4번이면
# 하루 0.5GB, 한 달 15GB 로 한도의 세 배다. 주 1회로 줄이면 하루 약 18MB 가 된다.
# 공지 원문과 본문은 매시 수집이 R2 공개 버킷에 전체 사본으로 남기므로 공지 자체는
# 이 백업이 아니어도 복구할 수 있다. 이 백업이 지키는 것은 운영 기록(실행 이력,
# 출처 상태, 중복 판정, 감사 기록)이고, 그 부분은 최대 7일치를 잃는다(17.3절).
#
# 시각은 한국 시간 일요일 04:52(UTC 토요일 19:52)다. 매시 17분에 시작해 20~25분
# 도는 수집 회차와 겹치지 않고, 15분마다 도는 수집 감시(3·18·33·48분)와도 겹치지
# 않는 분을 골랐다. 백업은 pg_dump 로 연결 하나만 쓰지만 수집과 겹치면 연결 상한
# (세션 모드 풀러 15개)에 그만큼 가까워진다.
on:
  schedule:
    - cron: "52 19 * * 6"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "새 백업을 만들지 않고 최근 백업만 확인"
        type: boolean
        default: false

concurrency:
  group: khu-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: production
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}
      KHU_R2_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
      # 백업 버킷은 쓰기 전용 키를 쓴다. 수집 실행의 키로 백업을 지울 수 없다(17.2절).
      KHU_R2_ACCESS_KEY_ID: ${{ secrets.KHU_R2_BACKUP_ACCESS_KEY_ID }}
      KHU_R2_SECRET_ACCESS_KEY: ${{ secrets.KHU_R2_BACKUP_SECRET_ACCESS_KEY }}
      KHU_R2_BUCKET_BACKUP: ${{ vars.KHU_R2_BUCKET_BACKUP || 'khu-notice-backup' }}
      KHU_BACKUP_PASSPHRASE: ${{ secrets.KHU_BACKUP_PASSPHRASE }}
      KHU_BACKUP_HEARTBEAT_URL: ${{ secrets.KHU_BACKUP_HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: PostgreSQL 클라이언트 설치
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 백업 만들기
        if: ${{ !inputs.verify_only }}
        run: python -m app.run.backup --prune

      - name: 백업 확인
        run: python -m app.run.backup --verify

      - name: 보관 목록
        if: always()
        run: |
          echo '### 보관 중인 백업' >> "$GITHUB_STEP_SUMMARY"
          python -m app.run.backup --list | tail -20 >> "$GITHUB_STEP_SUMMARY"
