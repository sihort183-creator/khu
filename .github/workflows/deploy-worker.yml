name: 조회 서버 배포

# main 에 조회 서버 코드가 올라가면 스스로 배포한다. 사람이 버튼을 누를 일을 만들지 않는다.
# 배포 전에 검사를 다시 돌리고, 배포 뒤에는 중계가 학교 밖 주소를 막는지 확인한다.
on:
  # 해당 코드가 main 에 올라가면 스스로 배포한다. 사람이 누를 일을 만들지 않는다.
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: khu-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 비밀값 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 비밀값이 없습니다. docs/프런트엔드_배포_준비.md 를 보세요."
            exit 1
          fi

      # 배포 전에 검사를 다시 돌린다. 통과한 것만 나간다.
      - name: 검사
        run: |
          npm install --no-package-lock
          node --check src/index.js
          node --test tests/*.test.mjs

      - name: 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: 중계 경로 확인
        env:
          BASE: ${{ vars.KHU_PUBLIC_API_BASE }}
        run: |
          [ -n "$BASE" ] || { echo "KHU_PUBLIC_API_BASE 변수가 없어 확인을 건너뜁니다"; exit 0; }
          # 학교 밖 주소는 중계하지 않아야 한다. 404 가 정상이다.
          outside=$(printf '%s' 'https://evil.example.com/a.png' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/v1/img/$outside")
          echo "학교 밖 주소 응답: $code"
          [ "$code" = "404" ] || { echo "::error::중계가 학교 밖 주소를 막지 않습니다"; exit 1; }
