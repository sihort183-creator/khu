name: 공지 수집

# 30분마다 수집한다(7.3절). 예약 실행은 최선 노력이라 늦을 수 있고,
# 제품에는 '2시간 내 반영'으로 표기한다.
# 첫 백필이 끝나면 매시간으로 되돌리는 것을 검토한다.
on:
  schedule:
    # 정각을 피해 지연을 줄인다.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "특정 출처만 실행 (출처 식별자, 공백 구분). 비우면 전체"
        required: false
        default: ""
      verbose:
        description: "자세한 기록"
        type: boolean
        default: false

# 이전 실행이 끝나기 전에는 새 실행이 기다린다(7.4절). 취소하지 않는다.
concurrency:
  group: khu-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: production
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}
      KHU_R2_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
      KHU_R2_ACCESS_KEY_ID: ${{ secrets.KHU_R2_ACCESS_KEY_ID }}
      KHU_R2_SECRET_ACCESS_KEY: ${{ secrets.KHU_R2_SECRET_ACCESS_KEY }}
      KHU_R2_BUCKET_PUBLIC: ${{ vars.KHU_R2_BUCKET_PUBLIC || 'khu-notice-public' }}
      KHU_R2_BUCKET_EVIDENCE: ${{ vars.KHU_R2_BUCKET_EVIDENCE || 'khu-notice-evidence' }}
      KHU_R2_BUCKET_BACKUP: ${{ vars.KHU_R2_BUCKET_BACKUP || 'khu-notice-backup' }}
      KHU_HEARTBEAT_URL: ${{ secrets.KHU_HEARTBEAT_URL }}
      # 워크플로 상한 55분. 수집을 40분에 끊어 내보내기·정리에 15분을 남긴다.
      KHU_RUN_BUDGET_SECONDS: "2400"
      # 첫 백필을 빨리 끝내기 위한 설정이다. 사이트가 125개인데 기본값(registrable)은
      # 이를 한 줄로 세워 2초에 1건씩만 받는다. host 모드는 사이트마다 따로 세어
      # 훨씬 빠르다. 백필이 끝나면 기본값으로 되돌리는 것을 검토한다.
      KHU_HOST_GROUP_MODE: host
      KHU_HTTP_DELAY_SECONDS: "0.5"
      KHU_HTTP_CONCURRENCY: "16"
      # 출처를 동시에 처리한다. 이 값이 1 이면 위 설정을 아무리 풀어도
      # 요청이 한 개씩만 날아간다. 데이터베이스 연결도 이만큼 함께 쓴다.
      KHU_SOURCE_CONCURRENCY: "12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 비밀값 확인
        run: |
          if [ -z "$KHU_DATABASE_URL" ]; then
            echo "::error::KHU_DATABASE_URL 비밀값이 없습니다. docs/BACKEND_SETUP.md 를 보세요."
            exit 1
          fi
          if [ -z "$KHU_R2_ACCESS_KEY_ID" ]; then
            echo "::error::R2 비밀값이 없습니다. docs/BACKEND_SETUP.md 를 보세요."
            exit 1
          fi

      - name: 수집 실행
        run: |
          python -m app.run.collect \
            ${{ inputs.verbose && '--verbose' || '' }} \
            ${{ inputs.sources && format('--sources {0}', inputs.sources) || '' }}

      - name: 실행 요약
        if: always()
        run: python -m app.ops.cli status >> "$GITHUB_STEP_SUMMARY"
