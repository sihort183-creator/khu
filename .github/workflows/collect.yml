name: 공지 수집

# 유지 수집은 60분마다 실행한다. 초기 수집은 별도 연속 실행기가 이어받는다.
# 제품에는 '2시간 내 반영'으로 표기한다.
on:
  schedule:
    # 정각을 피해 지연을 줄인다.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "특정 출처만 실행 (출처 식별자, 공백 구분). 비우면 전체"
        required: false
        default: ""
      verbose:
        description: "자세한 기록"
        type: boolean
        default: false
      initial_once:
        description: "초기 수집 단일 회차 검사: 공개·중복 비교 생략"
        type: boolean
        default: false
      export_probe:
        description: "수집 없이 공개를 연속 2회 실행하여 변경 없는 파일 재사용 실측"
        type: boolean
        default: false
      verify_date_order:
        description: "원문 목록 정렬을 검증하고 통과 출처의 날짜 경계 설정을 적용"
        type: boolean
        default: false

# 이전 실행이 끝나기 전에는 새 실행이 기다린다(7.4절). 취소하지 않는다.
concurrency:
  group: khu-collect
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 초기 작업은 270분 단위로 이어받고 공개·종료에 여유를 둔다.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: production
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}
      KHU_R2_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
      KHU_R2_ACCESS_KEY_ID: ${{ secrets.KHU_R2_ACCESS_KEY_ID }}
      KHU_R2_SECRET_ACCESS_KEY: ${{ secrets.KHU_R2_SECRET_ACCESS_KEY }}
      KHU_R2_BUCKET_PUBLIC: ${{ vars.KHU_R2_BUCKET_PUBLIC || 'khu-notice-public' }}
      KHU_R2_BUCKET_EVIDENCE: ${{ vars.KHU_R2_BUCKET_EVIDENCE || 'khu-notice-evidence' }}
      KHU_R2_BUCKET_BACKUP: ${{ vars.KHU_R2_BUCKET_BACKUP || 'khu-notice-backup' }}
      KHU_HEARTBEAT_URL: ${{ secrets.KHU_HEARTBEAT_URL }}
      KHU_INITIAL_UNTIL: ${{ vars.KHU_INITIAL_UNTIL }}
      # 유지 수집 예산. 초기 실행기는 짧은 회차로 덮어쓰고 연속 실행한다.
      KHU_RUN_BUDGET_SECONDS: "2400"
      # 첫 백필을 빨리 끝내기 위한 설정이다. 사이트가 125개인데 기본값(registrable)은
      # 이를 한 줄로 세워 2초에 1건씩만 받는다. host 모드는 사이트마다 따로 세어
      # 훨씬 빠르다. 백필이 끝나면 기본값으로 되돌리는 것을 검토한다.
      KHU_HOST_GROUP_MODE: host
      KHU_HTTP_DELAY_SECONDS: "0.5"
      KHU_HTTP_CONCURRENCY: "16"
      # 출처를 동시에 처리한다. 이 값이 1 이면 위 설정을 아무리 풀어도
      # 요청이 한 개씩만 날아간다. 데이터베이스 연결도 이만큼 함께 쓴다.
      # 변수로 두어 push 없이 조절한다. 백필이 끝나면 되돌리는 것도 변수로 한다.
      # 11 을 넘기지 않는다. Supabase 풀러가 세션 모드에서 사용자당 연결 15개로 막는다.
      # 이 값 + 4 가 실제 연결 수다. 넘기면 수집이 통째로 죽는다(app/storage/db.py 참조).
      KHU_SOURCE_CONCURRENCY: ${{ vars.KHU_SOURCE_CONCURRENCY || '10' }}
      # 남은 예산이 이보다 적으면 새 출처를 시작하지 않는다. 조각으로 착수하면
      # 저장은 0건인데 대기열 순번만 잃어 그 출처가 계속 꼬리에 갇힌다.
      KHU_SOURCE_MIN_BUDGET_SECONDS: ${{ vars.KHU_SOURCE_MIN_BUDGET_SECONDS || '30' }}
      # 최신순을 가정한 조기 종료. 역전을 만나면 그 출처만 자동으로 해제된다.
      KHU_OPTIMISTIC_DATE_BOUNDARY: ${{ vars.KHU_OPTIMISTIC_DATE_BOUNDARY || 'true' }}
      # 본문 그림 중계 주소. 비우면 상대 경로로 나가 화면 쪽 주소로 붙어 깨진다.
      KHU_PUBLIC_API_BASE: ${{ vars.KHU_PUBLIC_API_BASE }}
      # 초기 수집 중에는 DB 가 시간당 수천 건씩 자란다. 한 시간에 한 번 공개하면
      # 화면이 계속 서너 시간 낡은 것만 보여준다.
      KHU_PUBLISH_SECONDS: ${{ vars.KHU_PUBLISH_SECONDS || '1200' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 비밀값 확인
        run: |
          if [ -z "$KHU_DATABASE_URL" ]; then
            echo "::error::KHU_DATABASE_URL 비밀값이 없습니다. docs/BACKEND_SETUP.md 를 보세요."
            exit 1
          fi
          if [ -z "$KHU_R2_ACCESS_KEY_ID" ]; then
            echo "::error::R2 비밀값이 없습니다. docs/BACKEND_SETUP.md 를 보세요."
            exit 1
          fi

      - name: 날짜 경계 원문 검증 및 설정 적용
        if: inputs.verify_date_order
        run: |
          python -m app.ops.date_order audit --concurrency 12
          python -m app.ops.date_order apply

      - name: 날짜 경계 검증 결과 보관
        if: always() && inputs.verify_date_order
        uses: actions/upload-artifact@v4
        with:
          name: date-order-audit
          path: |
            backend/.localstore/date-order-audit.json
            backend/.localstore/date-order-audit/
          include-hidden-files: true
          retention-days: 7

      - name: 수집 실행
        env:
          SOURCES: ${{ inputs.sources }}
          VERBOSE: ${{ inputs.verbose }}
          INITIAL_ONCE: ${{ inputs.initial_once }}
          EXPORT_PROBE: ${{ inputs.export_probe }}
        run: |
          set -euo pipefail
          if [ "$EXPORT_PROBE" = "true" ]; then
            [ -z "$SOURCES" ] && [ "$INITIAL_ONCE" != "true" ] || { echo '공개 실측과 수집 입력을 함께 사용할 수 없습니다'; exit 1; }
            python -m app.run.export --repeat 2
          elif [ -n "$SOURCES" ] || [ "$INITIAL_ONCE" = "true" ]; then
            args=()
            if [ -n "$SOURCES" ]; then
              read -r -a ids <<< "$SOURCES"
              for id in "${ids[@]}"; do
                [[ "$id" =~ ^src-[a-z0-9]+$ ]] || { echo '잘못된 출처 식별자'; exit 1; }
              done
              args+=(--sources "${ids[@]}")
            fi
            [ "$VERBOSE" != "true" ] || args+=(--verbose)
            [ "$INITIAL_ONCE" != "true" ] || args+=(--initial --no-publish --no-dedupe)
            python -m app.run.collect "${args[@]}"
          else
            python -m app.run.initial
          fi

      # 이어받기는 백필의 본줄기다. 다만 이 잡이 붙잡고 있는 마감은 잡이 시작할 때
      # 읽은 값이라, 도중에 마감이 늘어난 것을 알지 못한다. 사슬이 끊기는 경우
      # (마감을 넘김·수집 단계 실패·잡 취소)는 watchdog.yml 이 저장소 변수를 새로
      # 읽어 되살린다. 여기서는 왜 이어받지 않았는지만 요약에 남긴다.
      - name: 초기 작업 이어받기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f .localstore/initial-result.json ]; then
            echo "초기 실행기 결과가 없습니다. 다음 회차는 감시(수집 감시)가 판단합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          continuation=$(python -c "import json; print(str(json.load(open('.localstore/initial-result.json'))['continue_initial']).lower())")
          if [ "$continuation" = "true" ]; then
            gh workflow run collect.yml --ref main
            echo "다음 초기 회차를 띄웠습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            remaining=$(python -c "import json; print(json.load(open('.localstore/initial-result.json')).get('remaining', '?'))")
            echo "이어받지 않습니다(남은 백필 $remaining). 백필이 남았는데 여기서 멈췄다면 마감(KHU_INITIAL_UNTIL)이 지난 것이고, 감시(수집 감시)가 늘어난 마감을 보고 되살립니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 순환 대상과 범위 미달 추세를 알려면 지난 회차 결과가 필요하다.
      # 없으면 첫 회차로 취급하고 그냥 진행한다. 복원 실패가 수집을 막지 않는다.
      - name: 이전 점검 결과 복원
        if: always()
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: backend/.localstore/selfcheck.json
          key: selfcheck-${{ github.run_id }}
          restore-keys: selfcheck-

      # 규칙 기반 점검이다. 실패해도 수집을 실패시키지 않는다(4절).
      - name: 자체 점검
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .localstore
          set +e
          python -m app.ops.selfcheck --probe-limit 30 --concurrency 4 \
            > .localstore/selfcheck-summary.md 2> .localstore/selfcheck-error.log
          code=$?
          {
            cat .localstore/selfcheck-summary.md
            if [ "$code" -ne 0 ]; then
              printf '\n자체 점검이 실패했습니다(종료 코드 %s). 수집 결과는 영향받지 않습니다.\n\n```\n' "$code"
              tail -n 20 .localstore/selfcheck-error.log
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat .localstore/selfcheck-error.log >&2
          exit "$code"

      - name: 자체 점검 결과 보관
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck
          path: |
            backend/.localstore/selfcheck.json
            backend/.localstore/selfcheck-summary.md
          include-hidden-files: true
          retention-days: 14

      - name: 실행 요약
        if: always()
        run: python -m app.ops.cli status >> "$GITHUB_STEP_SUMMARY"
