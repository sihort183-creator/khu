name: 검사

# Pull Request 와 main 병합에서 실행한다. 운영 비밀값을 주입하지 않는다(15.2절).
# 수집 워크플로는 pull_request 에서 절대 돌지 않으므로 외부 기여자가 비밀값에 닿지 못한다.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "registry/**"
      - "worker/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "registry/**"
      - "worker/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # 네트워크 없이 재현한다. 운영 연결 문자열을 쓰지 않는다.
      KHU_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 정적 검사
        run: ruff check app tests

      - name: 검사 실행
        run: pytest -q

      - name: 마이그레이션이 빈 데이터베이스에서 실행되는지 확인
        env:
          KHU_DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head
          rm -f ci-check.db

      - name: 등록부 형식 확인
        run: python -c "from app.ingestion.registry import load_registry; r = load_registry(); print(f'조직 {len(r.organizations)} / 출처 {len(r.sources)}')"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker 문법 확인
        run: node --check src/index.js
      - name: 조회 서버 압축·캐시 검사
        run: |
          npm install --no-package-lock
          node --test tests/*.test.mjs
