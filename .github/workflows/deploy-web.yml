name: 화면 배포

# 손으로 눌러야만 돈다. 기본은 빌드만 하고 배포하지 않는다.
# 배포는 사용자가 보는 것을 바꾸는 일이라 의도한 때에만 나가야 한다.
#
# OpenNext 는 Windows 에서 빌드되지 않는다(공식 경고). 그래서 빌드는 여기(리눅스)서 한다.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "빌드만 하지 않고 실제로 배포한다"
        type: boolean
        default: false

concurrency:
  group: khu-web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # 비우면 화면이 가상 데이터로 뜬다. 실제 자료를 보여주려면 반드시 있어야 한다.
      NEXT_PUBLIC_API_BASE: ${{ vars.KHU_PUBLIC_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 조회 서버 주소 확인
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE" ]; then
            echo "::error::KHU_PUBLIC_API_BASE 변수가 없습니다. 이대로 배포하면 가상 데이터가 뜹니다."
            exit 1
          fi
          echo "조회 서버: $NEXT_PUBLIC_API_BASE"

      - name: 검사
        run: |
          npm run lint
          npx tsc --noEmit

      - name: 빌드
        run: npm run cf:build

      - name: 빌드 결과 확인
        run: |
          test -f .open-next/worker.js || { echo "::error::worker.js 가 없습니다"; exit 1; }
          test -d .open-next/assets || { echo "::error::assets 가 없습니다"; exit 1; }
          du -sh .open-next

      - name: 배포
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 비밀값이 없습니다. docs/화면_배포_준비.md 를 보세요."
            exit 1
          fi
          npm run cf:deploy
