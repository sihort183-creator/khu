name: 운영 명령

# 14절: 1차에는 운영자 화면을 만들지 않는다. 운영 동작을 여기서 실행한다.
# 모든 변경 명령은 audit_logs 에 기록된다.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령"
        type: choice
        options:
          - sources sync
          - sources sync --retire-missing
          - sources list
          - sources promote
          - sources pause
          - contacts import
          - notice hide
          - notice reclassify --dry-run
          - notice reclassify --only scholarship
          - notice reclassify
          - notice reclassify --revert
          - export
          - check-sources
          - status
        required: true
      target:
        description: "대상 (출처 식별자·이름 또는 공지 식별자). 필요한 명령에서만 쓴다"
        required: false
        default: ""
      reason:
        description: "사유. 감사 기록에 남는다"
        required: false
        default: "운영 판단"

concurrency:
  group: khu-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    # export 는 공지 한 건마다 데이터베이스를 왕복해서 공지가 많으면 오래 걸린다.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: production
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}
      KHU_R2_ACCOUNT_ID: ${{ secrets.KHU_R2_ACCOUNT_ID }}
      KHU_R2_ACCESS_KEY_ID: ${{ secrets.KHU_R2_ACCESS_KEY_ID }}
      KHU_R2_SECRET_ACCESS_KEY: ${{ secrets.KHU_R2_SECRET_ACCESS_KEY }}
      KHU_R2_BUCKET_PUBLIC: ${{ vars.KHU_R2_BUCKET_PUBLIC || 'khu-notice-public' }}
      KHU_R2_BUCKET_EVIDENCE: ${{ vars.KHU_R2_BUCKET_EVIDENCE || 'khu-notice-evidence' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 명령 실행
        env:
          COMMAND: ${{ inputs.command }}
          TARGET: ${{ inputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            "sources sync")     python -m app.ops.cli sources sync ;;
            "sources sync --retire-missing")
              python -m app.ops.cli sources sync --retire-missing ;;
            "sources list")     python -m app.ops.cli sources list ;;
            "sources promote")  python -m app.ops.cli sources promote "$TARGET" --reason "$REASON" ;;
            "sources pause")    python -m app.ops.cli sources pause "$TARGET" --reason "$REASON" ;;
            "contacts import")  python -m app.ops.cli contacts import ;;
            "notice hide")      python -m app.ops.cli notice hide "$TARGET" --reason "$REASON" ;;
            "notice reclassify --dry-run")
              python -m app.ops.cli notice reclassify --dry-run --samples 60 ;;
            "notice reclassify --only scholarship")
              python -m app.ops.cli notice reclassify --only scholarship --reason "$REASON" ;;
            "notice reclassify")
              python -m app.ops.cli notice reclassify --reason "$REASON" ;;
            "notice reclassify --revert")
              python -m app.ops.cli notice reclassify --revert "$TARGET" --reason "$REASON" ;;
            "export")           python -m app.ops.cli export --prune ;;
            "check-sources")    python -m app.ops.cli check-sources --limit 100 ;;
            "status")           python -m app.ops.cli status ;;
            *) echo "::error::알 수 없는 명령: $COMMAND"; exit 1 ;;
          esac

      - name: 결과 요약
        if: always()
        run: python -m app.ops.cli status >> "$GITHUB_STEP_SUMMARY"
