name: 스키마 변경

# 스키마 변경은 손으로 실행한다(17.1절 3항).
# 수집 실행은 시작할 때 스키마 버전을 확인하고, 다르면 조용히 진행하지 않고 멈춘다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "적용할 리비전 (기본 head)"
        required: false
        default: "head"
      environment:
        description: "대상 환경"
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: "실제 적용 없이 계획만 본다"
        type: boolean
        default: true

concurrency:
  group: khu-migrate-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: backend
    env:
      KHU_ENV: ${{ inputs.environment }}
      KHU_DATABASE_URL: ${{ secrets.KHU_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 현재 상태
        run: |
          echo '### 적용 전' >> "$GITHUB_STEP_SUMMARY"
          alembic -c alembic.ini current 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 변경 계획
        run: alembic -c alembic.ini history --indicate-current

      - name: 적용
        if: ${{ !inputs.dry_run }}
        run: alembic -c alembic.ini upgrade ${{ inputs.target }}

      - name: 적용 후 상태
        if: ${{ !inputs.dry_run }}
        run: |
          echo '### 적용 후' >> "$GITHUB_STEP_SUMMARY"
          alembic -c alembic.ini current 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
